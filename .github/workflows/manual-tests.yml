name: Manual tests

# Runs the AutoHotkey manual test unattended on a Windows runner: the same clicks a person watches, without the pauses
# and checkpoints, so a change that breaks the manual test shows up here first. The run's log, screenshots and
# UI Automation dumps are in the ManualTestResults artifact.
on:
  push:
    branches: [main]
    paths: [src/**, testpackages/**, tests/manual/**, .github/workflows/manual-tests.yml]
  pull_request:
    paths: [src/**, testpackages/**, tests/manual/**, .github/workflows/manual-tests.yml]
  workflow_dispatch:

jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish the portable exe
        run: dotnet publish src/NetDeploy.App -p:PublishProfile=Portable

      - name: Build test packages
        run: dotnet run testpackages/build.cs

      # From AutoHotkey's GitHub releases: autohotkey.com puts a browser challenge in front of its downloads.
      - name: Install AutoHotkey
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo AutoHotkey/AutoHotkey --pattern 'AutoHotkey_2*.zip' --output "$env:RUNNER_TEMP\ahk.zip"
          Expand-Archive "$env:RUNNER_TEMP\ahk.zip" -DestinationPath "$env:RUNNER_TEMP\ahk"

      # The scripts, NetDeploy.exe, the packages and AutoHotkey in one folder, to run on a test machine.
      - name: Make the ready-to-run bundle
        run: |
          $bundle = "$env:RUNNER_TEMP\bundle"
          Copy-Item tests\manual $bundle -Recurse
          Copy-Item artifacts\portable\NetDeploy.exe $bundle
          New-Item "$bundle\packages" -ItemType Directory | Out-Null
          Copy-Item testpackages\dist\*.zip "$bundle\packages"
          Copy-Item "$env:RUNNER_TEMP\ahk\AutoHotkey64.exe" $bundle
          Copy-Item "$env:RUNNER_TEMP\ahk\license.txt" "$bundle\AutoHotkey-license.txt" -ErrorAction SilentlyContinue
          Set-Content "$bundle\Run tests.cmd" '@start "" "%~dp0AutoHotkey64.exe" "%~dp0NetDeployManualTests.ahk"'

      - uses: actions/upload-artifact@v4
        with:
          name: ManualTestBundle
          path: ${{ runner.temp }}/bundle/

      - name: Run the manual tests unattended
        run: |
          $out = "$env:RUNNER_TEMP\ahk-out.txt"; $err = "$env:RUNNER_TEMP\ahk-err.txt"
          $ahk = Start-Process "$env:RUNNER_TEMP\ahk\AutoHotkey64.exe" -Wait -PassThru -RedirectStandardOutput $out -RedirectStandardError $err `
            -ArgumentList '/ErrorStdOut', 'tests\manual\NetDeployManualTests.ahk', '--unattended', '--results', 'tests\manual\results'
          Get-Content $out, $err -ErrorAction SilentlyContinue
          Get-Content tests\manual\results\*\summary.txt -ErrorAction SilentlyContinue
          exit $ahk.ExitCode

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ManualTestResults
          path: tests/manual/results/
