name: Manual tests

# Runs the AutoHotkey manual test unattended on a Windows runner: the same clicks a person watches, without the pauses
# and checkpoints, so a change that breaks the manual test shows up here first. The run's log, screenshots and
# UI Automation dumps are in the ManualTestResults artifact.
on:
  push:
    branches: [main]
    paths: [src/**, testpackages/**, tests/manual/**, .github/workflows/manual-tests.yml]
  pull_request:
    paths: [src/**, testpackages/**, tests/manual/**, .github/workflows/manual-tests.yml]
  workflow_dispatch:

jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish the portable exe
        run: dotnet publish src/NetDeploy.App -p:PublishProfile=Portable

      - name: Build test packages
        run: dotnet run testpackages/build.cs

      # From AutoHotkey's GitHub releases: autohotkey.com puts a browser challenge in front of its downloads.
      - name: Install AutoHotkey
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo AutoHotkey/AutoHotkey --pattern 'AutoHotkey_2*.zip' --output "$env:RUNNER_TEMP\ahk.zip"
          Expand-Archive "$env:RUNNER_TEMP\ahk.zip" -DestinationPath "$env:RUNNER_TEMP\ahk"

      # The scripts, NetDeploy.exe, the packages and AutoHotkey in one folder, to run on a test machine.
      - name: Make the ready-to-run bundle
        run: |
          $bundle = "$env:RUNNER_TEMP\bundle"
          Copy-Item tests\manual $bundle -Recurse
          Copy-Item artifacts\portable\NetDeploy.exe $bundle
          New-Item "$bundle\packages" -ItemType Directory | Out-Null
          Copy-Item testpackages\dist\*.zip "$bundle\packages"
          Copy-Item "$env:RUNNER_TEMP\ahk\AutoHotkey64.exe" $bundle
          Copy-Item "$env:RUNNER_TEMP\ahk\license.txt" "$bundle\AutoHotkey-license.txt" -ErrorAction SilentlyContinue
          Set-Content "$bundle\Run tests.cmd" '@start "" "%~dp0AutoHotkey64.exe" "%~dp0NetDeployManualTests.ahk"'

      - uses: actions/upload-artifact@v4
        with:
          name: ManualTestBundle
          path: ${{ runner.temp }}/bundle/

      # The launcher has to fit a laptop, where the cut-off bottom hid Start. A small screen at 100% lays out like a
      # bigger one scaled up: 1280x720 like 1600x900 at 125%, 800x600 about like it at 150%. The folders give it
      # something to clean up, as after an earlier run; the run below removes them.
      - name: Check the launcher fits the screen
        run: |
          New-Item C:\Apps\Contoso.Orders, C:\Apps\Fabrikam.Reports, C:\ProgramData\Contoso.Orders -ItemType Directory -Force | Out-Null
          foreach ($size in '1600x900', '1280x720', '800x600') {
            $width, $height = $size -split 'x'
            try { Set-DisplayResolution -Width $width -Height $height -Force -ErrorAction Stop }
            catch { Write-Output "Skipped $size, which the screen can't do: $_"; continue }
            tests\manual\tools\Check-Launcher.ps1 -AutoHotkey "$env:RUNNER_TEMP\ahk\AutoHotkey64.exe" -Out tests\manual\results\launcher -Name $size
          }

      # The runner's screen is 1024x768, which leaves the folder list beside the package a row or less. 1600x900 leaves
      # it a few rows, as on a laptop, so the cases scroll it to reach the rows below.
      - name: Use a 1600x900 screen
        continue-on-error: true
        run: |
          Set-DisplayResolution -Width 1600 -Height 900 -Force
          Add-Type -AssemblyName System.Windows.Forms
          "The screen is now $([Windows.Forms.Screen]::PrimaryScreen.Bounds.Size)"

      # Waits for AutoHotkey itself, not Start-Process -Wait, which also waits for every process it started, such as
      # a NetDeploy left open by a failed case. The log is printed as it is written, so a slow step shows while it runs.
      - name: Run the manual tests unattended
        run: |
          $out = "$env:RUNNER_TEMP\ahk-out.txt"; $err = "$env:RUNNER_TEMP\ahk-err.txt"
          $ahk = Start-Process "$env:RUNNER_TEMP\ahk\AutoHotkey64.exe" -PassThru -RedirectStandardOutput $out -RedirectStandardError $err `
            -ArgumentList '/ErrorStdOut', 'tests\manual\NetDeployManualTests.ahk', '--unattended', '--results', "$env:GITHUB_WORKSPACE\tests\manual\results"
          $null = $ahk.Handle
          $printed = 0; $end = (Get-Date).AddMinutes(40)
          while (-not $ahk.WaitForExit(5000) -and (Get-Date) -lt $end) {
            $lines = @(Get-Content $out -ErrorAction SilentlyContinue)
            $lines | Select-Object -Skip $printed; $printed = $lines.Count
          }
          Get-Content $out -ErrorAction SilentlyContinue | Select-Object -Skip $printed
          Get-Content $err -ErrorAction SilentlyContinue
          Get-Content tests\manual\results\*\summary.txt -ErrorAction SilentlyContinue
          Stop-Process -Name NetDeploy -Force -ErrorAction SilentlyContinue
          if (-not $ahk.HasExited) {
            Write-Output "The manual tests were still running after 40 minutes. The screen is in timeout.png."
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $bounds = [Windows.Forms.Screen]::PrimaryScreen.Bounds
            $shot = New-Object Drawing.Bitmap $bounds.Width, $bounds.Height
            [Drawing.Graphics]::FromImage($shot).CopyFromScreen($bounds.Location, [Drawing.Point]::Empty, $bounds.Size)
            New-Item tests\manual\results -ItemType Directory -Force | Out-Null
            $shot.Save("$PWD\tests\manual\results\timeout.png")
            Stop-Process $ahk -Force; exit 1
          }
          exit $ahk.ExitCode

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ManualTestResults
          path: tests/manual/results/
