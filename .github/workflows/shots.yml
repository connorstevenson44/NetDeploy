name: Screenshots

on:
  push:
    branches: [ci-testpkg]

jobs:
  shots:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet build --configuration Release

      - run: dotnet test --configuration Release --no-build

      - name: Push screenshots
        if: always()
        shell: pwsh
        run: |
          Set-Location tests/NetDeploy.App.Tests/bin/Release/net10.0-windows/screenshots
          git init -q -b ci-screenshots
          git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "Screenshots from ${{ github.sha }}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-screenshots
