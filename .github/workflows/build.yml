name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build --configuration Release

      # The build already fails on an analyzer or code style warning; this checks the layout .editorconfig sets.
      - name: Check formatting
        run: dotnet format whitespace --verify-no-changes

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Publish portable exe
        run: dotnet publish src/NetDeploy.App -p:PublishProfile=Portable

      - uses: actions/upload-artifact@v4
        with:
          name: NetDeploy
          path: artifacts/portable/NetDeploy.exe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Screenshots
          path: tests/NetDeploy.App.Tests/bin/Release/net10.0-windows/screenshots/

  packages:
    # Builds the test packages, then deploys, upgrades and removes them on the runner.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build test packages
        run: dotnet run tests/test-packages/build.cs

      - name: Deploy, upgrade and remove them
        run: dotnet run --project tests/test-packages/e2e -- tests/test-packages/dist

      - name: Publish the portable exe
        run: dotnet publish src/NetDeploy.App -p:PublishProfile=Portable

      - name: Deploy one with the command line
        run: ./tests/test-packages/cli.ps1 -Exe artifacts/portable/NetDeploy.exe -Dist tests/test-packages/dist

      - uses: actions/upload-artifact@v4
        with:
          name: TestPackages
          path: tests/test-packages/dist/
