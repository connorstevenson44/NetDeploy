name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Publish portable exe
        run: dotnet publish src/NetDeploy.App -p:PublishProfile=Portable

      - uses: actions/upload-artifact@v4
        with:
          name: NetDeploy
          path: artifacts/portable/NetDeploy.exe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Screenshots
          path: tests/NetDeploy.App.Tests/bin/Release/net10.0-windows/screenshots/

      # Temporary: pushes the screenshots to a branch so the design can be reviewed without the Actions UI.
      - name: Push screenshots
        if: always() && github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          Set-Location tests/NetDeploy.App.Tests/bin/Release/net10.0-windows/screenshots
          git init -q -b ci-screenshots
          git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "Screenshots from ${{ github.sha }}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-screenshots
