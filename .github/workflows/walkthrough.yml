name: Walkthrough

# Runs NetDeploy's manual test cases with Walkthrough, the C# runner on FlaUI, unattended on a Windows runner: the same
# clicks a person watches, without the pauses. The run's log, screenshots, UI Automation dumps and junit.xml are in the
# WalkthroughResults artifact, and everything needed to run the cases on a test machine is in WalkthroughBundle.
on:
  push:
    branches: [main]
    paths: [src/**, testpackages/**, tests/walkthrough/**, .github/workflows/walkthrough.yml]
  pull_request:
    paths: [src/**, testpackages/**, tests/walkthrough/**, .github/workflows/walkthrough.yml]
  workflow_dispatch:
    inputs:
      cases:
        description: Cases to run, such as 1-2 or open-package
        default: ''

env:
  # The repository Walkthrough lives in (AutoTestRunner), and the branch to build walk from. A private repository needs a WALKTHROUGH_TOKEN secret
  # that can read it.
  WALKTHROUGH_REPO: connorstevenson44/AutoTestRunner
  WALKTHROUGH_REF: main

jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.WALKTHROUGH_REPO }}
          ref: ${{ env.WALKTHROUGH_REF }}
          path: .walkthrough
          token: ${{ secrets.WALKTHROUGH_TOKEN || github.token }}

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Self-contained, so the bundle runs on a test machine without the .NET 10 runtime.
      - name: Build walk
        run: dotnet publish .walkthrough/src/Walkthrough.Cli -c Release -r win-x64 --self-contained -o .walkthrough/bin

      - name: Check the suite's scripts
        run: .walkthrough/bin/walk.exe check tests/walkthrough/netdeploy

      - name: Publish the portable exe
        run: dotnet publish src/NetDeploy.App -p:PublishProfile=Portable

      - name: Build test packages
        run: dotnet run testpackages/build.cs

      # walk, the suite, NetDeploy.exe and the packages in one folder, to run on a test machine. The suite finds
      # NetDeploy.exe and the packages beside it.
      - name: Make the ready-to-run bundle
        run: |
          $bundle = "$env:RUNNER_TEMP\walkthrough-bundle"
          $suite = "$bundle\netdeploy"
          Copy-Item .walkthrough\bin "$bundle\walk" -Recurse
          Copy-Item tests\walkthrough\netdeploy $suite -Recurse
          Copy-Item artifacts\portable\NetDeploy.exe $suite
          New-Item "$suite\packages" -ItemType Directory | Out-Null
          Copy-Item testpackages\dist\*.zip "$suite\packages"
          Set-Content "$bundle\Run tests.cmd" '@"%~dp0walk\walk.exe" open "%~dp0netdeploy" %*'
          Set-Content "$bundle\Step through.cmd" '@"%~dp0walk\walk.exe" open "%~dp0netdeploy" --mode steps %*'

      - uses: actions/upload-artifact@v4
        with:
          name: WalkthroughBundle
          path: ${{ runner.temp }}/walkthrough-bundle/

      # The runner's screen is 1024x768, which leaves the folder list beside the package a row or less. 1600x900 leaves
      # it a few rows, as on a laptop.
      - name: Use a 1600x900 screen
        continue-on-error: true
        run: |
          Set-DisplayResolution -Width 1600 -Height 900 -Force
          Add-Type -AssemblyName System.Windows.Forms
          "The screen is now $([Windows.Forms.Screen]::PrimaryScreen.Bounds.Size)"

      # walk prints its log as it goes. Exit codes: 0 passed, 1 a case failed, 2 the exe or a package is missing,
      # 3 a script error, 4 not administrator.
      - name: Run the cases unattended
        timeout-minutes: 40
        run: |
          $cases = '${{ github.event.inputs.cases }}'
          $arguments = @('run', 'tests\walkthrough\netdeploy', '--unattended', '--results', 'tests\walkthrough\netdeploy\results')
          if ($cases) { $arguments += @('--cases', $cases) }
          & .walkthrough\bin\walk.exe @arguments
          $code = $LASTEXITCODE
          # The summary goes on the run's page, and as an annotation that shows on the pull request.
          $summary = Get-Content tests\walkthrough\netdeploy\results\*\summary.txt -Raw -ErrorAction SilentlyContinue
          if (-not $summary) { $summary = "walk exited with $code before it wrote a summary." }
          $summary
          $fence = '```'
          "$fence`n$summary`n$fence" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $level = if ($code -eq 0) { 'notice' } else { 'error' }
          $message = $summary.Trim().Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          Write-Output "::$level title=Walkthrough::$message"
          Stop-Process -Name NetDeploy -Force -ErrorAction SilentlyContinue
          exit $code

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WalkthroughResults
          path: tests/walkthrough/netdeploy/results/
